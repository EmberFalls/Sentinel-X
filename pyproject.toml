[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "custodian"
version = "0.1.0"
description = "Passive, evidence-aware network threat detection prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dpkt>=1.9.8,<2",
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "psutil>=6,<8",
    "pyarrow>=18,<26",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.6,<2",
    "uvicorn>=0.34,<1",
    "websockets>=14,<17",
    "xgboost>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
